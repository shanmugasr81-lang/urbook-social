name: fetch-backgrounds
on:
  workflow_dispatch:
  push:
    paths: ["backgrounds/index.json"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_backgrounds.py
      - run: |
          git config user.name "urbook-bot"
          git config user.email "contact@urbook.co.uk"
          git add backgrounds
          git diff --cached --quiet || (git commit -m "backgrounds: fetch licensed photos listed in index.json" && git push)
